# SmartHostel — development stack
#   docker compose up -d --build
#   docker compose exec backend npx prisma migrate dev --name init
#   docker compose exec backend npm run db:seed
#
# Frontend  http://localhost:5173
# API       http://localhost:5000/api/health
# Adminer   http://localhost:8080   (docker compose --profile tools up -d)

name: hostel-management

services:
  postgres:
    image: postgres:16-alpine
    container_name: hostel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hostel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hostel}
      POSTGRES_DB: ${POSTGRES_DB:-hostel_db}
      # Keeps index scans deterministic across host locales.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hostel} -d ${POSTGRES_DB:-hostel_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [hostel_net]

  backend:
    build:
      context: ./backend
      target: development
    container_name: hostel_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-hostel}:${POSTGRES_PASSWORD:-hostel}@postgres:5432/${POSTGRES_DB:-hostel_db}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      SEED_PASSWORD: ${SEED_PASSWORD:-Password123}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      # Source is bind-mounted for hot reload; node_modules stays in the image
      # so the container never picks up host-built (wrong-platform) binaries.
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [hostel_net]

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: hostel_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Vite proxies /api to the backend service (see vite.config.js).
      VITE_API_URL: ${VITE_API_URL:-/api}
      VITE_PROXY_TARGET: http://backend:5000
      # Needed for HMR to work through a bind mount on Windows/macOS.
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks: [hostel_net]

  adminer:
    image: adminer:latest
    container_name: hostel_adminer
    restart: unless-stopped
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    networks: [hostel_net]

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:

networks:
  hostel_net:
    driver: bridge
