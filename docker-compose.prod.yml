# SmartHostel — production-ish stack (nginx-served frontend, no bind mounts).
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec backend npx prisma migrate deploy
#
# App at http://localhost (nginx proxies /api to the backend).
# Set POSTGRES_PASSWORD, JWT_ACCESS_SECRET and JWT_REFRESH_SECRET in .env first.

name: hostel-management-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [hostel_net]

  backend:
    build:
      context: ./backend
      target: production
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    expose:
      - "5000"
    networks: [hostel_net]

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_URL: /api
    restart: always
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
    networks: [hostel_net]

volumes:
  postgres_data:

networks:
  hostel_net:
    driver: bridge
