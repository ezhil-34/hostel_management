server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames are safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # This is the production gateway. The browser only ever sees "/api"; which
    # service answers is decided here by path.
    #
    # nginx picks the LONGEST matching prefix regardless of order, so
    # /api/maintenance/ wins over /api/ — but keeping it first matches the Vite
    # dev config, where order does decide.
    location /api/maintenance/ {
        proxy_pass         http://maintenance-service:5100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Single-page app: every other path resolves to index.html so that
    # /outpass, /points, ... work on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
